<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DevHub — your personal developer workspace">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#0b0f19" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b0f19" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="24" fill="#0b0f19"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)" opacity="0.7"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="24" fill="url(#fade)"/>

  <!-- Logo mark: a commit graph with electric indigo -->
  <g transform="translate(80 84)">
    <rect width="68" height="68" rx="18" fill="url(#accent-grad)"/>
    <path d="M23 16v36M23 27c0 8.5 21 4 21 15" fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round"/>
    <circle cx="23" cy="18" r="5.2" fill="#ffffff"/>
    <circle cx="23" cy="49" r="5.2" fill="#ffffff"/>
    <circle cx="44" cy="42" r="5.2" fill="#6366f1" stroke="#ffffff" stroke-width="4.2"/>
  </g>

  <!-- Status pill -->
  <g transform="translate(162 104)">
    <rect width="144" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#34d399"/>
    <text x="24" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#a5b4fc">Workspace active</text>
  </g>

  <text x="80" y="218" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.8" fill="#f8fafc">DevHub</text>
  <text x="82" y="262" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="400" letter-spacing="-0.3" fill="#94a3b8">Projects, tasks, notes, snippets, secrets and builds,</text>
  <text x="82" y="294" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="400" letter-spacing="-0.3" fill="#94a3b8">in one calm, refined workspace you open every morning.</text>

  <!-- 14-day commit rail -->
  <g transform="translate(82 334)">
    <rect x="0" y="20" width="16" height="10" rx="3" fill="#1e293b"/>
    <rect x="22" y="12" width="16" height="18" rx="3" fill="#6366f1" opacity="0.45"/>
    <rect x="44" y="20" width="16" height="10" rx="3" fill="#1e293b"/>
    <rect x="66" y="6" width="16" height="24" rx="3" fill="#6366f1" opacity="0.75"/>
    <rect x="88" y="10" width="16" height="20" rx="3" fill="#6366f1" opacity="0.6"/>
    <rect x="110" y="20" width="16" height="10" rx="3" fill="#1e293b"/>
    <rect x="132" y="0" width="16" height="30" rx="3" fill="#6366f1"/>
    <rect x="154" y="12" width="16" height="18" rx="3" fill="#6366f1" opacity="0.55"/>
    <rect x="176" y="16" width="16" height="14" rx="3" fill="#6366f1" opacity="0.45"/>
    <rect x="198" y="20" width="16" height="10" rx="3" fill="#1e293b"/>
    <rect x="220" y="4" width="16" height="26" rx="3" fill="#6366f1" opacity="0.85"/>
    <rect x="242" y="8" width="16" height="22" rx="3" fill="#6366f1" opacity="0.7"/>
    <rect x="264" y="14" width="16" height="16" rx="3" fill="#6366f1" opacity="0.5"/>
    <rect x="286" y="2" width="16" height="28" rx="3" fill="#818cf8" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2.5"/>
    <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">14-day activity pulse</text>
    <text x="278" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#818cf8">Today</text>
  </g>

  <!-- Floating UI cards on the right -->
  <g transform="translate(740 54)">
    <!-- Kanban task card -->
    <rect x="0" y="0" width="310" height="186" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="18" y="18" width="84" height="22" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="28" cy="29" r="3" fill="#818cf8"/>
    <text x="36" y="33" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">In progress</text>
    <text x="274" y="33" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">3</text>
    
    <g transform="translate(18 50)">
      <rect width="274" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="12" y="14" width="16" height="16" rx="4" fill="none" stroke="#334155" stroke-width="1.8"/>
      <text x="38" y="26" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">Offline sync queue</text>
      <rect x="38" y="33" width="46" height="12" rx="4" fill="#451a03"/>
      <text x="44" y="42" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#fbbf24">Urgent</text>
      <text x="92" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Due today</text>
    </g>
    <g transform="translate(18 112)">
      <rect width="274" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="12" y="14" width="16" height="16" rx="4" fill="#059669"/>
      <path d="M16 22l2.5 2.5 5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="26" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-decoration="line-through">Migrate design tokens to v4</text>
      <rect x="38" y="33" width="56" height="12" rx="4" fill="#064e3b"/>
      <text x="44" y="42" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#34d399">Completed</text>
    </g>

    <!-- Code Snippet card -->
    <g transform="translate(130 206)">
      <rect width="350" height="142" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#f43f5e"/>
      <circle cx="34" cy="20" r="4.5" fill="#f59e0b"/>
      <circle cx="48" cy="20" r="4.5" fill="#10b981"/>
      <text x="70" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">auth-middleware.ts</text>
      <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a78bfa">export async function <tspan fill="#38bdf8">verifyUser</tspan><tspan fill="#f8fafc">(req) {</tspan></text>
      <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f8fafc">  const session = <tspan fill="#818cf8">await</tspan> auth.<tspan fill="#38bdf8">getSession</tspan>();</text>
      <text x="20" y="102" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f8fafc">  <tspan fill="#818cf8">return</tspan> session ? <tspan fill="#34d399">200</tspan> : <tspan fill="#fb7185">401</tspan>;</text>
      <text x="20" y="124" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f8fafc">}</text>
    </g>

    <!-- Vault Pill -->
    <g transform="translate(-46 226)">
      <rect width="168" height="46" rx="14" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="23" cy="23" r="11" fill="#4c0519"/>
      <rect x="18" y="21" width="10" height="8" rx="2" fill="#fb7185"/>
      <path d="M20.5 21v-2.5a2.5 2.5 0 0 1 5 0v2.5" fill="none" stroke="#fb7185" stroke-width="1.8"/>
      <text x="44" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" letter-spacing="2.5">••••••••</text>
      <rect x="120" y="14" width="36" height="18" rx="5" fill="#1e293b"/>
      <text x="126" y="26" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#a5b4fc">COPY</text>
    </g>
  </g>
</svg>
